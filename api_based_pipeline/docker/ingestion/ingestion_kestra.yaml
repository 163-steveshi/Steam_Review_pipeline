id: reiew_ingestion
namespace: steam_review_pipeline

description: This yaml schedule to run steam raw review ingestion task to the db. Recommend running it every 30 mins

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *" #set up to run every 30 mins
    timezone: America/Toronto

tasks:
  - id: run_ingestion_container
    type: io.kestra.plugin.docker.Run
    containerImage: steam-review-ingestion:latest
    # allow kestra to run the docker image in side the docker compose network
    networkMode: comp4905_project_default
    env:
      DATABASE_URL: "{{envs.database_url}}"
    commands:
      - "--app_id"
      - "730"
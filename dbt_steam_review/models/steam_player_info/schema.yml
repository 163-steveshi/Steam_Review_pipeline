          - name: IS_CURRENT
            description: "check if the current review is the latest review"
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_of_type:
                  arguments:
                    column_type: boolean
              - accepted_values:
                  arguments:
                    values: [true, false]

          - name: START_TIMESTAMP
            description: "SCD2 Table record valid start time"
            tests:

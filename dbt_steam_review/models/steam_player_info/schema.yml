                  expected_date: "'2012-08-21'::timestamp_ntz"
                  join_key: REVIEW_ID
          - no_later_than_test:
              arguments:
                timestamp_1: START_TIMESTAMP
                timestamp_2: END_TIMESTAMP
              name: review_valid_start_time_no_later_than_valid_end_time


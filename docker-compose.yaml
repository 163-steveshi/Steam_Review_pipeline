services:
  pgdatabase:
    image: postgres:14
    networks:
      - shared_net
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "./steam_reviews_postgres_data:/var/lib/postgresql/data"
      # run the kestra init script
      - "./postgres_init:/docker-entrypoint-initdb.d"
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10  
  pgadmin:
    image: dpage/pgadmin4
    networks:
      - shared_net
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      # - "./pgadmin_data:/var/lib/pgadmin"
      - pgadmin_data:/var/lib/pgadmin 
    ports:
      - "81:80"
  kestra:
    image: kestra/kestra:latest
    networks:
      - shared_net
    pull_policy: always
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: ${KESTRA_POSTGRES_URL}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_POSTGRES_USER}
            password: ${KESTRA_POSTGRES_PASSWORD}
        kestra:
          # server:
          #   basicAuth:
          #     username: admin@kestra.io # it must be a valid email address
          #     password: Admin1234 # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
      ENV_DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      pgdatabase:
        condition: service_healthy
networks:
  shared_net:
    name: steam_etl
volumes:
  kestra-data:
  pgadmin_data: